@keyframes lb{0%,50%{opacity:0}51%,94%{opacity:1;transform:translateY(0)}98%,100%{opacity:0;transform:translateY(-5px)}}
@keyframes ta{0%,3%{width:0}25%,100%{width:403.2px}}
@keyframes tb{0%,53%{width:0}74%,100%{width:352.8px}}
@keyframes ca{0%,3%{transform:translateX(0)}25%,100%{transform:translateX(403.2px)}}
@keyframes cb{0%,53%{transform:translateX(0)}74%,100%{transform:translateX(352.8px)}}
@keyframes na{0%,46%{opacity:1;transform:translateY(0)}50%,96%{opacity:0;transform:translateY(-5px)}100%{opacity:1;transform:translateY(0)}}
@keyframes nb{0%,46%{opacity:0;transform:translateY(5px)}50%,96%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-5px)}}
@media (prefers-reduced-motion:reduce){.a,.d,.blink,.br{animation:none!important}.glow,.lb,.nb{opacity:0}}
</style>
