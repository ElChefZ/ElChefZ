<svg xmlns="http://www.w3.org/2000/svg" width="480" height="232" viewBox="0 0 480 232" role="img" aria-label="ElChefZ — builds tools it wishes existed and gives them away: CleanPano, CleanWinVista, security-gatekeeper, design-director">
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Helvetica,Arial,sans-serif;fill:#fff}
.m{fill:#8E8E93;font-size:12px;font-weight:500}
.b{transform-box:fill-box;transform-origin:50% 50%}
.a{animation-duration:12s;animation-iteration-count:infinite;animation-fill-mode:both}
.hat{animation-name:hat;animation-timing-function:cubic-bezier(.7,0,.3,1)}
.br{animation:br 1.9s ease-in-out infinite}
.tile{animation-name:tile}
.glow{animation-name:glow;animation-timing-function:ease-in-out}
.s1{animation-name:s1}.s2{animation-name:s2}
.d{animation:dot 1.1s ease-in-out infinite}
.d2{animation-delay:.15s}.d3{animation-delay:.3s}
.bub{animation-name:bub;transform-origin:100% 100%}
.type{animation-name:type;animation-timing-function:linear}
.ans{animation-name:ans}
.car{animation-name:car;animation-timing-function:linear}
.blink{animation:blink 1s ease-in-out infinite}
.chip{animation-name:chip;animation-timing-function:cubic-bezier(.2,1.3,.4,1)}
.c2{animation-delay:.45s}.c3{animation-delay:.9s}.c4{animation-delay:1.35s}
.pop{animation-name:pop;animation-timing-function:cubic-bezier(.2,1.6,.4,1)}
.foot{animation-name:foot}
@keyframes hat{0%{transform:rotate(0)}24%,100%{transform:rotate(360deg)}}
@keyframes br{0%,100%{transform:scale(1)}50%{transform:scale(1.09)}}
@keyframes tile{0%,22%{fill-opacity:.24}11%{fill-opacity:.15}30%,96%{fill-opacity:.15}100%{fill-opacity:.24}}
@keyframes glow{0%,8%,16%{opacity:.95}4%,12%,20%{opacity:.3}28%,96%{opacity:0}100%{opacity:.95}}
@keyframes s1{0%,20%{opacity:1;transform:translateY(0)}24%,96%{opacity:0;transform:translateY(-6px)}100%{opacity:1;transform:translateY(0)}}
@keyframes s2{0%,22%{opacity:0;transform:translateY(6px)}27%,93%{opacity:1;transform:translateY(0)}97%,100%{opacity:0;transform:translateY(-6px)}}
@keyframes dot{0%,100%{opacity:.35;transform:translateY(0)}50%{opacity:1;transform:translateY(-2px)}}
@keyframes bub{0%,3%{opacity:0;transform:translateY(8px) scale(.82)}8%,90%{opacity:1;transform:translateY(0) scale(1)}94%,100%{opacity:0;transform:translateY(-4px) scale(1)}}
@keyframes type{0%,24%{width:0}40%,100%{width:326px}}
@keyframes ans{0%,90%{opacity:1}94%,100%{opacity:0}}
@keyframes car{0%,24%{transform:translateX(0);opacity:1}40%{transform:translateX(326px);opacity:1}46%,100%{transform:translateX(326px);opacity:0}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
@keyframes chip{0%,44%{opacity:0;transform:translateY(8px)}50%,88%{opacity:1;transform:translateY(0)}92%,100%{opacity:0;transform:translateY(-4px)}}
@keyframes pop{0%,48%{transform:scale(0)}54%,100%{transform:scale(1)}}
@keyframes foot{0%,62%{opacity:0}68%,88%{opacity:1}92%,100%{opacity:0}}
@media (prefers-reduced-motion:reduce){.a,.d,.blink,.br{animation:none!important}.s1,.glow,.car{opacity:0}}
</style>
<defs><clipPath id="t"><rect class="a type" x="20" y="108" width="326" height="24"/></clipPath></defs>

<rect x=".5" y=".5" width="479" height="231" rx="28" fill="#050506" stroke="rgba(255,255,255,.1)"/>

<rect class="a glow" x="17" y="15" width="50" height="50" rx="17" fill="none" stroke="#5B9BE6" stroke-opacity=".45" stroke-width="2"/>
