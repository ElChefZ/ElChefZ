<text x="76" y="37" font-size="17" font-weight="600">ElChef</text>
<g class="a s1 b"><text class="m" x="76" y="56">Thinking</text>
<circle class="d b" cx="131" cy="52" r="1.8" fill="#8E8E93"/><circle class="d d2 b" cx="138" cy="52" r="1.8" fill="#8E8E93"/><circle class="d d3 b" cx="145" cy="52" r="1.8" fill="#8E8E93"/></g>
<text class="m a s2 b" x="76" y="56">Indie dev · Windows apps · Claude skills</text>
