<svg xmlns="http://www.w3.org/2000/svg" width="300" height="112" viewBox="0 0 300 112" role="img" aria-label="ElChefZ writing Claude skills: security-gatekeeper and design-director">
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Helvetica,Arial,sans-serif;fill:#fff}
.mono{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace}
.n{font-size:12.5px;font-weight:600}.ds{font-size:10.5px;fill:#A9A9B0}
.m{fill:#8E8E93;font-size:11px;font-weight:500}
.b{transform-box:fill-box;transform-origin:50% 50%}
.a{animation-duration:12s;animation-iteration-count:infinite;animation-fill-mode:both}
.cat{animation-name:cat;animation-timing-function:cubic-bezier(.7,0,.3,1)}
.br{animation:br 1.9s ease-in-out infinite}
.glow{animation-name:glow}
.d{animation:dot 1.1s ease-in-out infinite}.d2{animation-delay:.15s}.d3{animation-delay:.3s}
.blink{animation:blink 1s ease-in-out infinite}
.la{animation-name:la}.lb{animation-name:lb}
.t1{animation-name:t1;animation-timing-function:steps(19,end)}.c1{animation-name:c1;animation-timing-function:steps(19,end)}
.t2{animation-name:t2;animation-timing-function:steps(34,end)}.c2{animation-name:c2;animation-timing-function:steps(34,end)}
.t3{animation-name:t3;animation-timing-function:steps(15,end)}.c3{animation-name:c3;animation-timing-function:steps(15,end)}
.t4{animation-name:t4;animation-timing-function:steps(32,end)}.c4{animation-name:c4;animation-timing-function:steps(32,end)}
.na{animation-name:na}.nb{animation-name:nb}
@keyframes cat{0%{transform:rotate(0)}9%,50%{transform:rotate(360deg)}59%,100%{transform:rotate(720deg)}}
@keyframes br{0%,100%{transform:scale(1)}50%{transform:scale(1.09)}}
