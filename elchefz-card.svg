<circle class="a pop c2 b" cx="259" cy="157" r="4" fill="#7AA2FF"/><text x="271" y="161.5" font-size="12.5" font-weight="600">CleanWinVista</text><text class="m" x="450" y="161.5" font-size="10.5" text-anchor="end">Win 11 dock</text></g>
<g class="a chip c3 b"><rect x="20" y="178" width="216" height="30" rx="10" fill="#111113" stroke="rgba(255,255,255,.07)"/>
