@keyframes lb{0%,50%{opacity:0}51%,94%{opacity:1;transform:translateY(0)}98%,100%{opacity:0;transform:translateY(-5px)}}
@keyframes t1{0%,3%{width:0}11%,100%{width:142.5px}}
@keyframes c1{0%,3%{transform:translateX(0);opacity:1}11%,12%{transform:translateX(142.5px);opacity:1}13%,100%{transform:translateX(142.5px);opacity:0}}
@keyframes t2{0%,13%{width:0}28%,100%{width:214.2px}}
@keyframes c2{0%,12%{transform:translateX(0);opacity:0}13%{transform:translateX(0);opacity:1}28%,100%{transform:translateX(214.2px);opacity:1}}
@keyframes t3{0%,53%{width:0}60%,100%{width:112.5px}}
