@keyframes t4{0%,63%{width:0}78%,100%{width:201.6px}}
@keyframes c4{0%,62%{transform:translateX(0);opacity:0}63%{transform:translateX(0);opacity:1}78%,100%{transform:translateX(201.6px);opacity:1}}
@keyframes na{0%,46%{opacity:1;transform:translateY(0)}50%,96%{opacity:0;transform:translateY(-5px)}100%{opacity:1;transform:translateY(0)}}
@keyframes nb{0%,46%{opacity:0;transform:translateY(5px)}50%,96%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-5px)}}
@media (prefers-reduced-motion:reduce){.a,.d,.blink,.br{animation:none!important}.glow,.lb,.nb{opacity:0}}
</style>
